[package]
name = "xwork"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "xwork_lib"

[[bin]]
name = "xwork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.4"
ts-rs = "=12.0.1"

[dev-dependencies]
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["test"] }
tempfile = "=3.27.0"
