[package]
name = "xwork"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "xwork_lib"

[[bin]]
name = "xwork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
gix = { version = "=0.87.1", default-features = false, features = ["status", "parallel", "sha1", "sha256"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-os = "=2.3.2"
tauri-plugin-single-instance = "=2.4.4"
tokio = { version = "=1.53.1", features = ["sync"] }
ts-rs = "=12.0.1"
uuid = { version = "=1.26.0", features = ["v4"] }
zeroize = "=1.9.0"

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
tempfile = "=3.27.0"
