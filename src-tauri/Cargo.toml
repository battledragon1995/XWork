[package]
name = "xwork"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "xwork_lib"

[[bin]]
name = "xwork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
blake3 = "=1.8.7"
gix = { version = "=0.87.1", default-features = false, features = ["status", "parallel", "sha1", "sha256"] }
ignore = "=0.4.33"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
mime_guess = "=2.0.5"
notify = "=8.2.0"
portable-pty = "=0.9.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-os = "=2.3.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-single-instance = "=2.4.4"
tokio = { version = "=1.53.1", features = ["sync", "time"] }
ts-rs = "=12.0.1"
uuid = { version = "=1.26.0", features = ["v4"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt", "time", "test-util"] }
